async function loadMesh(){

 const r=await fetch('./mesh.bin');if(!r.ok)throw new Error('mesh '+r.status);return await r.arrayBuffer();

let mats=opaque;if(meta.meshGroups?.length){for(const g of meta.meshGroups)geom.addGroup(g.start,g.count,g.materialIndex??(g.material==='transparent'?1:0));mats=[opaque,glass]}scene.add(new THREE.Mesh(geom,mats));

const pointers=new Map();let gesture=null;
function pan(dx,dy){camera.updateMatrix();const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);target.addScaledVector(right,-dx*radius*.0015).addScaledVector(up,dy*radius*.0015)}
function multi(){const a=[...pointers.values()];if(a.length<2)return null;return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}}
